<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikola Vudrag | 3D Sculpture Viewer</title>
    <meta name="description"
        content="Interactive 3D Gaussian splat viewer — explore Nikola Vudrag's sculptures in immersive detail">

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        /* Critical CSS */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050508;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #loading-screen.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 1px solid #3a3a4a;
            border-top-color: #c9a77a;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            margin-top: 2rem;
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #6b6b7a;
        }

        /* Back button */
        .back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: 1px solid rgba(201, 167, 122, 0.3);
            border-radius: 50px;
            background: rgba(5, 5, 8, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #c9a77a;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(201, 167, 122, 0.12);
            border-color: #c9a77a;
        }

        /* Scroll hint */
        #scroll-hint {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            opacity: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #scroll-hint span {
            color: #c9a77a;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        #scroll-hint.hidden {
            opacity: 0;
        }

        #scroll-hint svg {
            color: #c9a77a;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(8px);
            }

            60% {
                transform: translateY(4px);
            }
        }

        /* Title overlay */
        .splat-title {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            text-align: center;
            pointer-events: none;
        }

        .splat-title__number {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #c9a77a;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .splat-title__name {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 300;
            color: #f0ebe3;
            letter-spacing: 0.06em;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
        }

        .splat-title__subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 300;
            color: #6b6b7a;
            letter-spacing: 0.15em;
            margin-top: 0.5rem;
        }
    </style>
  <script type="module" crossorigin src="/assets/splatViewer-D8kh-Ctg.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/state-DFY6wBk_.js">
  <link rel="modulepreload" crossorigin href="/assets/playcanvas-D5Kv4vzz.js">
  <link rel="modulepreload" crossorigin href="/assets/post-effects-BQyOr9mx.js">
</head>

<body>
    <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to Gallery
    </a>

    <div id="canvas-container"></div>

    <div class="splat-title">
        <div class="splat-title__number">01 / 03</div>

        <div class="splat-title__subtitle">The face beneath the surface</div>
    </div>

    <div id="scroll-hint">
        <span>Scroll to explore</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
    </div>

    <div id="loading-screen">
        <div class="loader-ring"></div>
        <span class="loader-text">Loading 3D sculptures...</span>
    </div>

</body>

</html>

---
deployment:
  tasks:
    - export DEPLOYPATH=/home/varazdin/vudrag.varazdin.studio
    # Activate Node.js environment
    - source /home/varazdin/nodevenv/vudrag.varazdin.studio/cms/22/bin/activate && cd /home/varazdin/vudrag.varazdin.studio/cms
    # --- Frontend ---
    # Install dependencies and build
    - npm install
    - npm run build
    # Copy built frontend to document root
    - /bin/cp -R dist/* $DEPLOYPATH/
    # Copy public assets (splats, images, etc.)
    - /bin/cp -R public/* $DEPLOYPATH/
    # --- CMS Backend ---
    - /bin/mkdir -p $DEPLOYPATH/cms/services
    - /bin/cp cms/server.js $DEPLOYPATH/cms/
    - /bin/cp cms/package.json $DEPLOYPATH/cms/
    - /bin/cp cms/package-lock.json $DEPLOYPATH/cms/
    - /bin/cp -R cms/services/* $DEPLOYPATH/cms/services/
    # Install CMS production dependencies
    - cd $DEPLOYPATH/cms && npm install --production
    # --- Admin Panel ---
    - /bin/cp -R admin $DEPLOYPATH/

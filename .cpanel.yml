---
deployment:
  tasks:
    # --- Build frontend on the server ---
    # NODE_ENV must be set to development so npm ci installs devDependencies (Vite)
    - /bin/bash -c 'export HOME=/home/varazdin && export NODE_ENV=development && source /home/varazdin/nodevenv/vudrag.varazdin.studio/cms/22/bin/activate && cd /home/varazdin/repositories/vudrag-site && npm ci --include=dev && npm run build'
    # --- Copy frontend build output to document root ---
    - /bin/cp -R /home/varazdin/repositories/vudrag-site/dist/* /home/varazdin/vudrag.varazdin.studio/
    # --- Copy public assets (splats, images, etc.) ---
    - /bin/cp -R /home/varazdin/repositories/vudrag-site/public/* /home/varazdin/vudrag.varazdin.studio/
    # --- Copy CMS backend files ---
    - /bin/mkdir -p /home/varazdin/vudrag.varazdin.studio/cms/services
    - /bin/cp /home/varazdin/repositories/vudrag-site/cms/server.js /home/varazdin/vudrag.varazdin.studio/cms/
    - /bin/cp /home/varazdin/repositories/vudrag-site/cms/package.json /home/varazdin/vudrag.varazdin.studio/cms/
    - /bin/cp /home/varazdin/repositories/vudrag-site/cms/package-lock.json /home/varazdin/vudrag.varazdin.studio/cms/
    - /bin/cp -R /home/varazdin/repositories/vudrag-site/cms/services/* /home/varazdin/vudrag.varazdin.studio/cms/services/
    # --- Copy admin panel ---
    - /bin/cp -R /home/varazdin/repositories/vudrag-site/admin /home/varazdin/vudrag.varazdin.studio/
